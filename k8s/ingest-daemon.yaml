---
# Fills the Redis "files" list from the database whenever it drains.
#
# This must stay at one replica. The daemon refills when the list is empty,
# without tracking what is already in flight, so two of them would queue the
# same rows twice -- and dicom_file has no primary key on file_id, so a
# double import writes duplicate rows rather than failing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posda-ingest-daemon
  labels:
    app.kubernetes.io/name: posda-ingest-daemon
    app.kubernetes.io/component: queue-filler
    app.kubernetes.io/part-of: posda-ingest
spec:
  replicas: 1
  strategy:
    # Never run two daemons, not even for the seconds of a rolling update.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: posda-ingest-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posda-ingest-daemon
        app.kubernetes.io/component: queue-filler
        app.kubernetes.io/part-of: posda-ingest
    spec:
      # The daemon holds no file when it stops; it only needs long enough to
      # finish the batch it is queueing.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 2123
        fsGroup: 2123
      containers:
        - name: daemon
          image: registry.dbmi.cloud/posda:1.1.6
          args: ["file-process-py"]
          envFrom:
            - configMapRef:
                name: posda-ingest-config
            - secretRef:
                name: posda-ingest-db
          volumeMounts:
            - name: cache
              mountPath: /home/posda/cache
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: posda-cache
