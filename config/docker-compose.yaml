services:

  ## The main relational database
  ## Change the pgdata_alpine volume to a drive location to preserve
  ## data long-term.
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - pgdata_alpine:/var/lib/postgresql
      - ./database/all.sql:/docker-entrypoint-initdb.d/all.sql
    ports:
      - 5433:5432

  ## Queue server for synchronizing things
  redis:
    image: redis:8
    restart: always

  ## Periodic job runner
  steve:
    image: registry.dbmi.cloud/posda:1.1.19
    working_dir: "/home/posda/posdatools/systemd"
    command: "/home/posda/posdatools/systemd/run_in_posda_env.sh /steve/steve.py"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
      - ./steve:/steve
    env_file:
      - database.env
      - common.env
      - posda.env

  ## Service for submitting files to NBIA. Only needed if NBIA is used.
  # ream:
  #     image: registry.dbmi.cloud/posda:1.1.19
  #     restart: always
  #     volumes:
  #         - posda_cache_alpine:/home/posda/cache
  #         - ./posda/posdatools:/home/posda/posdatools
  #         - ./ream:/ream
  #     env_file:
  #         - database.env
  #         - common.env
  #         - ream.env
  #         - posda.env

  ## Service for exporting files to an external Posda instance.
  # exodus:
  #     image: registry.dbmi.cloud/exodus:1.1.19
  #     restart: always
  #     volumes:
  #         - posda_cache_alpine:/home/posda/cache
  #         - ./posda/posdatools:/home/posda/posdatools
  #         - ./exodus:/exodus
  #     env_file:
  #         - database.env
  #         - common.env
  #         - exodus.env
  #         - posda.env

  ## Generates thumnails for images submitted to NBIA
  thumbs:
    image: registry.dbmi.cloud/lanterna:1.1.19
    command: "/scripts/thumbs.py"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
      - ./lanterna:/scripts
    env_file:
      - database.env
      - common.env
    deploy:
      replicas: 1

  ## Generates Kaleidoscope projections
  magicka:
    image: registry.dbmi.cloud/lanterna:1.1.19
    command: "/scripts/magicka.py"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
      - ./lanterna:/scripts
    env_file:
      - database.env
      - common.env
      - posda.env
    deploy:
      replicas: 1

  ## The main application server
  posda:
    image: registry.dbmi.cloud/posda:1.1.19
    restart: always
    depends_on:
      - db
    ports:
      - 64610-64699:64610-64699
      - 11112:11112
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - nbia.env
      - posda.env

  ## A worker that processes the low-priority queue (0)
  ## Increase the replicas to increase concurrent processes
  posda-worker-low:
    image: registry.dbmi.cloud/posda:1.1.19
    command: worker
    restart: always
    depends_on:
      - db
      - redis
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - nbia.env
      - posda.env
    environment:
      WORKER_PRIORITY: 0
    deploy:
      replicas: 1

  ## A worker that processes the high-priority queue (1)
  ## Increase the replicas to increase concurrent processes
  posda-worker-high:
    image: registry.dbmi.cloud/posda:1.1.19
    command: worker
    restart: always
    depends_on:
      - db
      - redis
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - nbia.env
      - posda.env
    environment:
      WORKER_PRIORITY: 1
    deploy:
      replicas: 1

  ## Fills the Redis import queue from the database.
  ## Run exactly one of these -- a second replica queues the same rows twice.
  ingest-daemon:
    image: registry.dbmi.cloud/posda:1.1.19
    working_dir: "/home/posda/posdatools/systemd"
    command: "/home/posda/posdatools/systemd/run_in_posda_env.sh python3 -m posda.ingest.daemon"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - posda.env
      - ingest.env

  ## Parses DICOM files and imports them to the db.
  ## Increase the replicas to increase concurrent processes.
  ingest-file-worker:
    image: registry.dbmi.cloud/posda:1.1.19
    working_dir: "/home/posda/posdatools/systemd"
    command: "/home/posda/posdatools/systemd/run_in_posda_env.sh python3 -m posda.ingest.daemon file-worker"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - posda.env
      - ingest.env
    deploy:
      replicas: 3

  ## Second pass over each imported file, recording where the pixel data is.
  ## Increase the replicas to increase concurrent processes.
  ingest-pixel-worker:
    image: registry.dbmi.cloud/posda:1.1.19
    working_dir: "/home/posda/posdatools/systemd"
    command: "/home/posda/posdatools/systemd/run_in_posda_env.sh python3 -m posda.ingest.daemon pixel-worker"
    restart: always
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/posdatools:/home/posda/posdatools
    env_file:
      - database.env
      - common.env
      - posda.env
      - ingest.env
    deploy:
      replicas: 3

  ## Main API server
  posda-api:
    image: registry.dbmi.cloud/posda:1.1.19
    command: api
    restart: always
    depends_on:
      - db
      - posda
    env_file:
      - database.env
      - common.env
      - api.env
      - posda.env
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - ./posda/fastapi/app:/fastapi
      - ./posda/posdatools:/home/posda/posdatools

  ## API server for Kaleidoscope application
  kaleidoscope:
    image: registry.dbmi.cloud/kaleidoscope:1.1.19
    restart: always
    depends_on:
      - db
      - posda
    volumes:
      - posda_cache_alpine:/home/posda/cache
      - kaleidoscope_files:/html
    env_file:
      - database.env
      - common.env
      - posda.env
    # environment:
    #     DEBUG: 1

  ## The main web server which proxies traffic to all other services
  web:
    image: registry.dbmi.cloud/posda_web:1.1.19
    restart: always
    ports:
      - 80:8080
      - 443:8443
    depends_on:
      - posda
      - kaleidoscope
    links:
      - posda:posda
      - posda-api:posda-api
      - kaleidoscope:kaleidoscope
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf
      - ./web/posda-error.html:/www/posda-error.html
      - ./web/www/import.html:/www/import.html
      - ./web/www/upload.html:/www/upload.html
      - ./web/nginx.crt:/nginx.crt
      - ./web/nginx.key:/nginx.key
      - type: volume
        source: kaleidoscope_files
        target: /kaleidoscope
        volume:
          nocopy: true
volumes:
  posda_cache_alpine:
  pgdata_alpine:
  kaleidoscope_files:
