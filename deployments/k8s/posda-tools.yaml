## This is the complete config for the posda.tools website

apiVersion: v1
kind: ConfigMap
metadata:
  name: posda-tools-nginx
  namespace: posda
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /nas/public/posda/website;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
            autoindex on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posda-tools
  namespace: posda
  labels:
    app: posda-tools
spec:
  replicas: 3
  selector:
    matchLabels:
      app: posda-tools
  template:
    metadata:
      labels:
        app: posda-tools
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nas-public
              mountPath: /nas/public
              readOnly: true
      volumes:
        - name: nas-public
          persistentVolumeClaim:
            claimName: nas-public
        - name: nginx-config
          configMap:
            name: posda-tools-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: posda-tools
  namespace: posda
spec:
  selector:
    app: posda-tools
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: posda-tools
  namespace: posda
spec:
  ingressClassName: nginx
  rules:
    - host: posda.tools
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: posda-tools
                port:
                  number: 80
