# The Posda nginx: serves the SPAs and static files, proxies to posda and
# posda-api. Kept as-is (instead of translating its routing into Ingress
# rules); the cluster Ingress just forwards everything here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: posda
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: posda
    spec:
      # from `user: "1000:2123"` in the compose files
      securityContext:
        runAsUser: 1000
        runAsGroup: 2123
      containers:
        - name: web
          image: tcia/posda_web:1.0.35
          resources:
            requests:
              cpu: 500m
              memory: 32Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: web.conf
            - name: certs
              mountPath: /nginx.crt
              subPath: nginx.crt
            - name: certs
              mountPath: /nginx.key
              subPath: nginx.key
            # HTML overlays live on the posda-deploy PVC (import.html is
            # 3.4MB, over the ConfigMap size limit, so none are ConfigMaps).
            - name: posda-deploy
              mountPath: /www/posda-error.html
              subPath: oneposda/web/posda-error.html
              readOnly: true
            - name: posda-deploy
              mountPath: /www/import.html
              subPath: oneposda/web/www/import.html
              readOnly: true
            - name: posda-deploy
              mountPath: /www/upload.html
              subPath: oneposda/web/www/upload.html
              readOnly: true
            # static content generated by the kaleidoscope pod, served at /k
            - name: nas-public
              mountPath: /kaleidoscope
              subPath: posda/k8s/data/kaleidoscope-files
              readOnly: true
            - name: nas-public
              mountPath: /nas/public
            - name: nas-public
              mountPath: /nas/new/public
            - name: nas-intake
              mountPath: /nas/intake
            - name: nas-nlst
              mountPath: /nas/nlst
            - name: s3-posda-archive
              mountPath: /nas/posda-archive
              mountPropagation: HostToContainer
            - name: s3-faspex
              mountPath: /nas/faspex
              mountPropagation: HostToContainer
            - name: s3-pathology
              mountPath: /nas/pathology
              mountPropagation: HostToContainer
            - name: s3-ross-faspex
              mountPath: /nas/ross/faspex
              mountPropagation: HostToContainer
            - name: s3-ross-posda-pathology
              mountPath: /nas/ross/posda-pathology
              mountPropagation: HostToContainer
            - name: s3-ross-intermediate-archive
              mountPath: /nas/ross/posda-intermediate-archive
              mountPropagation: HostToContainer
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx-conf
        - name: certs
          secret:
            secretName: web-certs
        - name: nas-public
          persistentVolumeClaim:
            claimName: nas-public
        - name: posda-deploy
          persistentVolumeClaim:
            claimName: posda-deploy
        - name: nas-intake
          persistentVolumeClaim:
            claimName: nas-intake
        - name: nas-nlst
          persistentVolumeClaim:
            claimName: nas-nlst
        - name: s3-posda-archive
          hostPath:
            path: /nas/posda-archive
            type: Directory
        - name: s3-faspex
          hostPath:
            path: /nas/faspex
            type: Directory
        - name: s3-pathology
          hostPath:
            path: /nas/pathology
            type: Directory
        - name: s3-ross-faspex
          hostPath:
            path: /nas/ross/faspex
            type: Directory
        - name: s3-ross-posda-pathology
          hostPath:
            path: /nas/ross/posda-pathology
            type: Directory
        - name: s3-ross-intermediate-archive
          hostPath:
            path: /nas/ross/posda-intermediate-archive
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: posda
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    # POSDA_INTERNAL_API_URL points at http://web:8080/papi, so the service
    # name and port must stay exactly this.
    - name: http
      port: 8080
    - name: https
      port: 8443
