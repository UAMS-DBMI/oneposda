# The FastAPI-based API server (proxied by web nginx at /papi/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posda-api
  labels:
    app.kubernetes.io/name: posda-api
    app.kubernetes.io/part-of: posda
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: posda-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posda-api
        app.kubernetes.io/part-of: posda
    spec:
      containers:
        - name: api
          image: tcia/posda:1.0.4
          args: ["api"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          envFrom:
            - secretRef:
                name: database-env
            - secretRef:
                name: common-env
            - configMapRef:
                name: api-env
            - configMapRef:
                name: posda-env
          ports:
            - name: http
              containerPort: 8087
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nas-public
              mountPath: /nas/public
            - name: nas-public
              mountPath: /nas/new/public
            - name: nas-intake
              mountPath: /nas/intake
            - name: nas-nlst
              mountPath: /nas/nlst
            - name: s3-posda-archive
              mountPath: /nas/posda-archive
              mountPropagation: HostToContainer
            - name: s3-faspex
              mountPath: /nas/faspex
              mountPropagation: HostToContainer
            - name: s3-pathology
              mountPath: /nas/pathology
              mountPropagation: HostToContainer
            - name: s3-ross-faspex
              mountPath: /nas/ross/faspex
              mountPropagation: HostToContainer
            - name: s3-ross-posda-pathology
              mountPath: /nas/ross/posda-pathology
              mountPropagation: HostToContainer
            - name: s3-ross-intermediate-archive
              mountPath: /nas/ross/posda-intermediate-archive
              mountPropagation: HostToContainer
            # code-on-PVC: the FastAPI application
            - name: posda-deploy
              mountPath: /fastapi
              subPath: oneposda/posda/fastapi/app
              readOnly: true
            - name: posda-deploy
              mountPath: /home/posda/posdatools
              subPath: oneposda/posda/posdatools
              readOnly: true
            - name: posda-env-file
              mountPath: /home/posda/posdatools/posda.env
              subPath: posda.env
      volumes:
        - name: nas-public
          persistentVolumeClaim:
            claimName: nas-public
        - name: posda-deploy
          persistentVolumeClaim:
            claimName: posda-deploy
        - name: nas-intake
          persistentVolumeClaim:
            claimName: nas-intake
        - name: nas-nlst
          persistentVolumeClaim:
            claimName: nas-nlst
        - name: s3-posda-archive
          hostPath:
            path: /nas/posda-archive
            type: Directory
        - name: s3-faspex
          hostPath:
            path: /nas/faspex
            type: Directory
        - name: s3-pathology
          hostPath:
            path: /nas/pathology
            type: Directory
        - name: s3-ross-faspex
          hostPath:
            path: /nas/ross/faspex
            type: Directory
        - name: s3-ross-posda-pathology
          hostPath:
            path: /nas/ross/posda-pathology
            type: Directory
        - name: s3-ross-intermediate-archive
          hostPath:
            path: /nas/ross/posda-intermediate-archive
            type: Directory
        - name: posda-env-file
          configMap:
            name: posda-env-file
---
apiVersion: v1
kind: Service
metadata:
  name: posda-api
  labels:
    app.kubernetes.io/name: posda-api
    app.kubernetes.io/part-of: posda
spec:
  selector:
    app.kubernetes.io/name: posda-api
  ports:
    - name: http
      port: 8087
