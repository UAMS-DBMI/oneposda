# The main Posda application server.
#
# This file documents the storage layout used (in identical or reduced form)
# by every posda-family deployment:
#
#   - nas-public (NFS PVC) is mounted at BOTH /nas/public and /nas/new/public
#     because DB-recorded file paths reference both, but they are the same
#     export on the NAS.
#   - The s3-* volumes are rclone/goofys FUSE mounts managed by systemd units
#     on every node, passed through as hostPath. mountPropagation:
#     HostToContainer makes a host-side remount (after a FUSE crash/restart)
#     visible to already-running pods.
#   - Code is NOT baked into the images; the live trees are rsynced to
#     /nas/public/posda/k8s/deploy/oneposda/posda/ and mounted via subPath
#     (see README.md).
#   - /home/posda/cache replaces the posda_cache_alpine docker volume. The
#     real cache root is $POSDA_CACHE_ROOT on the NAS; this path only holds
#     the POSDA_VERSION marker (which keeps the entrypoint's setup() from
#     re-running) plus whatever legacy code still writes there.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posda
  labels:
    app.kubernetes.io/name: posda
    app.kubernetes.io/part-of: posda
spec:
  # Singleton: owns the DICOM receiver and the 646xx sub-application ports.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: posda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posda
        app.kubernetes.io/part-of: posda
    spec:
      containers:
        - name: posda
          image: tcia/posda:1.0.4
          # image ENTRYPOINT is /docker-entrypoint; default CMD "main"
          envFrom:
            - secretRef:
                name: database-env
            - secretRef:
                name: common-env
            - configMapRef:
                name: nbia-env
            - configMapRef:
                name: posda-env
          env:
            - name: POSDA_DEBUG
              value: "1"
          ports:
            - name: dicom
              containerPort: 11112
            - name: http
              containerPort: 64610
          readinessProbe:
            tcpSocket:
              port: 64610
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: nas-public
              mountPath: /nas/public
            - name: nas-public
              mountPath: /nas/new/public
            - name: nas-intake
              mountPath: /nas/intake
            - name: nas-nlst
              mountPath: /nas/nlst
            - name: s3-posda-archive
              mountPath: /nas/posda-archive
              mountPropagation: HostToContainer
            - name: s3-faspex
              mountPath: /nas/faspex
              mountPropagation: HostToContainer
            - name: s3-pathology
              mountPath: /nas/pathology
              mountPropagation: HostToContainer
            - name: s3-ross-faspex
              mountPath: /nas/ross/faspex
              mountPropagation: HostToContainer
            - name: s3-ross-posda-pathology
              mountPath: /nas/ross/posda-pathology
              mountPropagation: HostToContainer
            - name: s3-ross-intermediate-archive
              mountPath: /nas/ross/posda-intermediate-archive
              mountPropagation: HostToContainer
            - name: nas-public
              mountPath: /home/posda/posdatools
              subPath: posda/k8s/deploy/oneposda/posda/posdatools
            - name: nas-public
              mountPath: /home/posda/cache
              subPath: posda/k8s/data/legacy-cache
            - name: posda-env-file
              mountPath: /home/posda/posdatools/posda.env
              subPath: posda.env
      volumes:
        - name: nas-public
          persistentVolumeClaim:
            claimName: nas-public
        - name: nas-intake
          persistentVolumeClaim:
            claimName: nas-intake
        - name: nas-nlst
          persistentVolumeClaim:
            claimName: nas-nlst
        - name: s3-posda-archive
          hostPath:
            path: /nas/posda-archive
            type: Directory
        - name: s3-faspex
          hostPath:
            path: /nas/faspex
            type: Directory
        - name: s3-pathology
          hostPath:
            path: /nas/pathology
            type: Directory
        - name: s3-ross-faspex
          hostPath:
            path: /nas/ross/faspex
            type: Directory
        - name: s3-ross-posda-pathology
          hostPath:
            path: /nas/ross/posda-pathology
            type: Directory
        - name: s3-ross-intermediate-archive
          hostPath:
            path: /nas/ross/posda-intermediate-archive
            type: Directory
        - name: posda-env-file
          configMap:
            name: posda-env-file
---
# Exposes the DICOM receiver plus the legacy sub-application ports
# (64610-64630) that the web nginx proxies to. Nothing outside the cluster
# uses the 646xx ports; 11112 is exposed externally via ingress-nginx TCP
# forwarding (see dicom-tcp.yaml).
apiVersion: v1
kind: Service
metadata:
  name: posda
  labels:
    app.kubernetes.io/name: posda
    app.kubernetes.io/part-of: posda
spec:
  selector:
    app.kubernetes.io/name: posda
  ports:
    - name: dicom
      port: 11112
    - name: p64610
      port: 64610
    - name: p64611
      port: 64611
    - name: p64612
      port: 64612
    - name: p64613
      port: 64613
    - name: p64614
      port: 64614
    - name: p64615
      port: 64615
    - name: p64616
      port: 64616
    - name: p64617
      port: 64617
    - name: p64618
      port: 64618
    - name: p64619
      port: 64619
    - name: p64620
      port: 64620
    - name: p64621
      port: 64621
    - name: p64622
      port: 64622
    - name: p64623
      port: 64623
    - name: p64624
      port: 64624
    - name: p64625
      port: 64625
    - name: p64626
      port: 64626
    - name: p64627
      port: 64627
    - name: p64628
      port: 64628
    - name: p64629
      port: 64629
    - name: p64630
      port: 64630
