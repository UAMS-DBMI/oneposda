---
# The live code, mounted read-only by every posda-family pod. The NAS was
# too slow for code (Perl stats/opens hundreds of small files at every
# interpreter start); Longhorn RWX is still NFS behind the scenes (a
# share-manager pod exports the volume), but it is cluster-local and far
# lower latency. Holds a shallow clone of the oneposda repo's master
# branch, updated by jobs/sync-deploy.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: posda-deploy
  namespace: posda
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
