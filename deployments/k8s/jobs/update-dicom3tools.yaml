apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-dicom3tools
  namespace: posda
  labels:
    app.kubernetes.io/name: update-dicom3tools
    app.kubernetes.io/part-of: posda
spec:
  schedule: "0 3 * * *"          # 3am daily, standard cron syntax
  concurrencyPolicy: Forbid       # don't overlap runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120    # skip run if it can't start within this window
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: update-dicom3tools
            app.kubernetes.io/part-of: posda
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: git
              image: tcia/update-dciom3tools:2
              workingDir: /home/user
              command: ["/home/user/update.sh"]
              env:
                - name: GIT_SSH_COMMAND
                  value: "ssh -i /etc/git-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/git-ssh/known_hosts"
              volumeMounts:
                - name: git-ssh
                  mountPath: /etc/git-ssh
                  readOnly: true
          volumes:
            - name: git-ssh
              secret:
                secretName: imphub-ssh-key
                defaultMode: 0400
