apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: posda

resources:
  - namespace.yaml
  - storage.yaml
  - ingress.yaml
  - apps/redis.yaml
  - apps/posda.yaml
#  - apps/posda-workers.yaml
#  - apps/posda-fast-file-process.yaml
  - apps/posda-api.yaml
#  - apps/thumbs.yaml
#  - apps/magicka.yaml
#  - apps/steve.yaml
#  - apps/ream.yaml
#  - apps/kaleidoscope.yaml
  - apps/web.yaml

# The *.env sources below are gitignored (they contain credentials).
# Copy them from the prod host into config/ before running kustomize build.
# The generated names get a content hash suffix, so editing an env file and
# re-applying triggers a rolling restart of every pod that consumes it.
configMapGenerator:
  - name: api-env
    envs:
      - config/api.env
  - name: nbia-env
    envs:
      - config/nbia.env
  - name: posda-env
    envs:
      - config/posda.env
  # The sourceable (export-style) copy of posda.env, mounted over
  # /home/posda/posdatools/posda.env in every posda-family pod. This is the
  # k8s equivalent of the `./posda-old.env:/home/posda/posdatools/posda.env`
  # bind mount in docker-compose.prod.yaml.
  - name: posda-env-file
    files:
      - posda.env=config/posda-old.env
  - name: web-nginx-conf
    files:
      - config/default.conf

secretGenerator:
  # common.env holds POSDA_API_SYSTEM_TOKEN, database.env holds PGPASSWORD,
  # ream.env holds NBIA credentials -- all Secrets, not ConfigMaps.
  - name: common-env
    envs:
      - config/common.env
  - name: database-env
    envs:
      - config/database.env
  - name: ream-env
    envs:
      - config/ream.env
  # The cert/key pair the web nginx expects at /nginx.crt and /nginx.key.
  - name: web-certs
    files:
      - config/nginx.crt
      - config/nginx.key
  # The same pair in the format the Ingress controller expects.
  - name: posda-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=config/nginx.crt
      - tls.key=config/nginx.key
