proxy_cache_path /tmp/auth-cache levels=1:2 keys_zone=auth_cache:1m max_size=10m inactive=10m;

upstream backend {
    server posda-api:8087;
    keepalive 32;
}

server {
    listen 8443 default_server ssl;
    ssl_certificate /nginx.crt;
    ssl_certificate_key /nginx.key;

	listen 8080 default_server;

    client_max_body_size 0;
    root /www;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }

    location /openapi.json {
        proxy_pass http://posda-api:8087/openapi.json;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    location /ohif {
        alias /www/ohif;
        try_files $uri /$uri /ohif/index.html;
    }

    location /files/ {
        auth_request /auth-check;
        #alias /nas/public/posda/storage/;
        alias /www/files/;
    }

    location /papi/ {
        proxy_pass http://backend;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /auth-check {
        internal;

        proxy_pass http://backend/papi/auth/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_cache auth_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_key "$http_authorization$http_cookie";
    }

    location /release {
        alias /www/release;
        try_files $uri /$uri /release/index.html;
    }

    location /viewer {
        alias /www/quince;
        try_files $uri /$uri /viewer/index.html;
    }

    location /mira {
        alias /www/mira;
        try_files $uri /$uri /mira/index.html;
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    location /kohlrabi/ {
        alias /www/kohlrabi/;
        try_files $uri /$uri /kohlrabi/index.html;
    }

    location /k {
        alias /kaleidoscope;
        try_files $uri /$uri /k/index.html;
    }

    location /dashboard {
        try_files $uri /$uri /dashboard/index.html;
    }

    location /roots {
        alias /www/roots;
        try_files $uri /$uri /roots/index.html;
    }

	location /posda/ {
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://posda:64610/;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
    }
    # Sub-application (per-session) processes. The Perl controllers emit
    # /pa/<port>/... (Posda::Config::SubAppUrlPath), so one location covers
    # the whole port pool. The variable upstream makes nginx resolve "posda"
    # per request through its own resolver; 127.0.0.11 is Docker's embedded
    # DNS. The port is restricted to 646xx so this cannot be used to reach
    # arbitrary ports on the posda host.
    location ~ ^/pa/(646\d\d)/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://posda:$1/$2$is_args$args;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout  300;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        error_page 502 /posda-error.html;
    }
}
