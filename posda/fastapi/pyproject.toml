[project]
name = "posda-api"
version = "0.1.0"
description = "Posda API (FastAPI). The deployed image installs app/requirements.txt; this file mirrors it so tests run with uv."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "asyncpg",
    "uvicorn",
    "redis",
    "requests",
    "httpx",
    "aiofiles",
    "numpy",
    "jinja2",
    "zipstream",
    "python-multipart",
    "chardet",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
